[package]
name = "swaptray"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Linux system tray app that manages a single swap file: create, turn on/off, delete"
repository = "https://github.com/manhavn/swaptray"
readme = "README.md"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
] }
egui = "0.36"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
parking_lot = "0.12"
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
usvg = { version = "0.48", default-features = false }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
strip = true
lto = "thin"
